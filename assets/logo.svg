<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E5A7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#EAC775" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#B8BCC2" />
      <stop offset="100%" stop-color="#6F737A" />
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Watch Icon / Emblem (Left) -->
  <g transform="translate(10, 10)">
    <!-- Outer Watch Bezel with Minute Indents -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="1 5" opacity="0.6"/>
    <circle cx="50" cy="50" r="42" fill="#0D0F14" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="50" cy="50" r="37" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>

    <!-- 12, 3, 6, 9 markers -->
    <rect x="49" y="15" width="2" height="6" fill="url(#goldGrad)" rx="1"/>
    <rect x="79" y="49" width="6" height="2" fill="url(#goldGrad)" rx="1"/>
    <rect x="49" y="79" width="2" height="6" fill="url(#goldGrad)" rx="1"/>
    <rect x="15" y="49" width="6" height="2" fill="url(#goldGrad)" rx="1"/>

    <!-- Geometric Tourbillon / Horology Cage -->
    <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.45"/>
    <polygon points="50,26 71,38 71,62 50,74 29,62 29,38" fill="none" stroke="url(#silverGrad)" stroke-width="0.8" opacity="0.3"/>

    <!-- Central Interlocking 'A' Monogram -->
    <path d="M50 24 L34 72 H41 L45 59 H55 L59 72 H66 Z M47 53 L50 40 L53 53 Z" fill="url(#goldGrad)" filter="url(#luxuryGlow)"/>

    <!-- Watch Hands -->
    <!-- Hour Hand -->
    <line x1="50" y1="50" x2="62" y2="40" stroke="url(#silverGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Minute Hand -->
    <line x1="50" y1="50" x2="38" y2="30" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Center Pivot Pin -->
    <circle cx="50" cy="50" r="3" fill="#0D0F14" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="1.2" fill="url(#goldGrad)"/>

    <!-- Crown at 3 o'clock -->
    <path d="M92 45 H96 V55 H92 Z" fill="url(#goldGrad)"/>
    <path d="M96 46 H98 V54 H96 Z" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- Typography: ABID STORE -->
  <g transform="translate(130, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="6" fill="url(#goldGrad)">
      ABID STORE
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="3" y="66" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="7" fill="#C5C8CF" opacity="0.9">
      HAUTE HORLOGERIE • LUXURY WATCHES
    </text>

    <!-- Decorative separator line -->
    <line x1="3" y1="76" x2="380" y2="76" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.5"/>
    <circle cx="191" cy="76" r="2" fill="url(#goldGrad)"/>
  </g>
</svg>
